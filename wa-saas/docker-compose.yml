# Local development infrastructure. Do NOT use these credentials in production.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wasaas
      MYSQL_USER: wasaas
      MYSQL_PASSWORD: wasaas
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/wasaas-media;
      mc anonymous set none local/wasaas-media;
      mc encrypt set sse-s3 local/wasaas-media || true;
      exit 0;"

  api:
    build: ./backend
    command: ["node", "dist/main.js"]
    env_file: ./backend/.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]

  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: ./backend/.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  browser-worker:
    build: { context: ./backend, dockerfile: Dockerfile.browser }
    env_file: ./backend/.env
    environment:
      BROWSER_DATA_DIR: /data/sessions
      METRICS_PORT: "9465"
    volumes: [browser-sessions:/data/sessions]
    shm_size: "1gb"
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # Optional malware scanning for uploads (set CLAMAV_HOST=clamav). Start with: docker compose --profile scan up
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports: ["3310:3310"]

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  mysql-data:
  redis-data:
  minio-data:
  browser-sessions:
