version: 2
updates:
  - { package-ecosystem: npm, directory: /backend, schedule: { interval: weekly }, open-pull-requests-limit: 10,
      ignore: [ { dependency-name: "whatsapp-web.js" } ] }   # upgrade manually after staging tests (blueprint §7)
  - { package-ecosystem: npm, directory: /web, schedule: { interval: weekly } }
  - { package-ecosystem: gradle, directory: /android, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly } }
  - { package-ecosystem: docker, directory: /backend, schedule: { interval: monthly } }
