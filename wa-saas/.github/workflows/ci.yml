name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: ci }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - name: Migrations match schema (reviewed migrations, blueprint §15)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS ci_shadow" 2>/dev/null || true
          if [ -d prisma/migrations ]; then
            npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
              --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
            npx prisma migrate deploy
          else
            echo "::error::No prisma/migrations folder. Run 'npx prisma migrate dev --name init' and commit it."; exit 1
          fi
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/*.apk }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relay-api ./backend
      - run: docker build -t relay-browser -f backend/Dockerfile.browser ./backend
      - run: docker build -t relay-web ./web
